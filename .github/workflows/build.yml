name: Build Conecta Assistant

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: |
          echo "Aguardando os arquivos do projeto Android"
          if [ ! -f app/build.gradle.kts ]; then
            echo "Arquivos do aplicativo ainda não foram enviados."
            exit 1
          fi
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ConectaAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
